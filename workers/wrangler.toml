name = "tripquest"
main = "worker.mjs"
compatibility_date = "2024-11-01"

# 這個 Worker 是純同步 API（/health /push /pull /blob）。
# App 本身留在 GitHub Pages；Worker 送 CORS 標頭，跨網域呼叫沒問題。
# 驗證是靠邀請祕鑰（bearer token），不是靠同源。

[[d1_databases]]
binding = "DB"
database_name = "tripquest"
database_id = "FILL_ME"  # publish-cloud.sh 會自動填；或手動貼上 wrangler d1 create tripquest 印出的 database_id

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "tripquest-photos"

[vars]
MAX_BLOB_BYTES = "15000000"

# ---- 可選的 AI 加值層 ----
# 金鑰一律用 `wrangler secret put`（不要寫在這個檔案，也不要進 git）：
#   wrangler secret put AI_ACCESS_TOKEN    自訂通行碼，填進 App 設定分享給家人
#   wrangler secret put ANTHROPIC_API_KEY  行程/景點/旁白文字
#   wrangler secret put GOOGLE_TTS_KEY     語音旁白（沒有就 TTS 停用）
# 下面幾個是「用量上限」的預設值，可自行調整：
AI_MODEL = "claude-haiku-4-5"
AI_MONTHLY_CAP_USD = "5"
AI_RATE_PER_MIN = "6"
AI_RATE_GLOBAL_PER_MIN = "30"
