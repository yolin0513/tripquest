name = "tripquest"
main = "worker.mjs"
compatibility_date = "2024-11-01"

# 這個 Worker 是純同步 API（/health /push /pull /blob）。
# App 本身留在 GitHub Pages；Worker 送 CORS 標頭，跨網域呼叫沒問題。
# 驗證是靠邀請祕鑰（bearer token），不是靠同源。

# 每天 03:00 UTC 清一次過期的旅伴位置（見 worker.mjs 的 sweepPositions）。
# Cron Trigger 在免費方案可用。
[triggers]
crons = ["0 3 * * *"]

# 限流（v1.65）寫在 worker.mjs 裡、用 D1 計數。
# 這裡刻意**不用** Cloudflare 的 Rate Limiting 綁定：實測在這個帳號/方案上它完全不計數
#（連續 40 次以上呼叫、額度設 5／10 秒，每次都回 success:true），官方文件也自承它
# 「不是精確的計數系統」。而 WAF 的 rate limiting 規則對 workers.dev 不適用（要有 zone）。

[[d1_databases]]
binding = "DB"
database_name = "tripquest"
database_id = "6b841a4d-9e03-4952-8cbc-7e665690802c"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "tripquest-photos"

[vars]
MAX_BLOB_BYTES = "15000000"

# AI 不經這個 Worker。每個行程由建立者在 App 內輸入自己的 API 金鑰，
# 瀏覽器直連 api.anthropic.com / texttospeech.googleapis.com。詳見 docs/AI_INTEGRATION.md。
